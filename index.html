<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿意同行 - 专注生态保护与低碳生活</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #52b788;
            --accent: #d8f3dc;
            --text-dark: #1b4332;
            --text-muted: #555;
            --bg-light: #f7faf8;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }
        header {
            background-color: var(--white);
            border-bottom: 1px solid #e2ece9;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 1.5rem;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }
        nav a:hover { color: var(--primary-light); }
        .hero {
            padding: 5rem 2rem;
            text-align: center;
            background: linear-gradient(180deg, #d8f3dc 0%, var(--bg-light) 100%);
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        .hero p {
            max-width: 600px;
            margin: 0 auto 2rem auto;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }
        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #ebf3ef;
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: inline-block;
        }
        .card h3 {
            margin-bottom: 0.6rem;
            color: var(--primary);
            font-size: 1.25rem;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        footer {
            text-align: center;
            padding: 3rem 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #e2ece9;
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🌿 绿意同行</div>
        <nav>
            <a href="#initiatives">绿色倡议</a>
            <a href="#actions">日常行动</a>
            <a href="#about">关于我们</a>
        </nav>
    </header>

    <section class="hero">
        <h1>守护蓝色星球，从身边绿意开始</h1>
        <p>践行低碳生活方式，促进人与自然和谐共生。我们致力于普及生态环保知识，推动日常低碳行动实践。</p>
    </section>

    <main class="container" id="initiatives">
        <div class="grid">
            <div class="card">
                <div class="card-icon">🌱</div>
                <h3>低碳出行</h3>
                <p>倡导步行、骑行与公共交通，降低化石能源依赖与碳排放，共同呼吸清新空气。</p>
            </div>
            <div class="card">
                <div class="card-icon">♻️</div>
                <h3>循环利用</h3>
                <p>减少一次性塑料制品消耗，实行严格垃圾分类，让资源在循环中发挥持久价值。</p>
            </div>
            <div class="card">
                <div class="card-icon">💡</div>
                <h3>高效节能</h3>
                <p>合理利用电力与水资源，随手关灯拔插头，推行绿色办公与节约型家居生活。</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 绿意同行生态发展公益空间. All rights reserved.</p>
    </footer>
</body>
</html>
